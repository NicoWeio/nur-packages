name: Build packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Evaluate and build packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Evaluate package set
        run: |
          nix-env -f . -qaP \
            --arg pkgs 'import <nixpkgs> { config.allowUnfree = true; }' \
            --json | jq -r 'keys[]'

      - name: Build all packages
        run: |
          nix-env -f . -qaP \
            --arg pkgs 'import <nixpkgs> { config.allowUnfree = true; }' \
            --json \
          | jq -r 'keys[]' \
          | while IFS= read -r attribute; do
              echo "Building $attribute"
              nix-build --no-out-link \
                -A "$attribute" \
                --arg pkgs 'import <nixpkgs> { config.allowUnfree = true; }'
            done
